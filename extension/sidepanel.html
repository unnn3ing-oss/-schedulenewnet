<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>網新快速排程</title>
<link rel="stylesheet" href="sidepanel.css">
</head>
<body class="sp">
<header class="top">
  <div class="top-btns">
    <a class="btn primary" href="https://unnn3ing-oss.github.io/-schedulenewnet/" target="_blank" rel="noopener" title="在新分頁開啟網新快速排程">網頁版</a>
    <a class="btn" href="https://digi-social-post.tvbs.ai/ip/newsnet/" target="_blank" rel="noopener" title="在新分頁開啟原本的網新發文台">舊版</a>
  </div>
  <nav class="tabs" role="tablist" aria-label="側邊欄">
    <button type="button" role="tab" id="tabPost" aria-controls="panePost" aria-selected="true">發文</button>
    <button type="button" role="tab" id="tabInfo" aria-controls="paneInfo" aria-selected="false">狀態與更新<span class="dot" id="infoDot" hidden>新</span></button>
  </nav>
</header>

<!-- 發文：直接嵌入網頁版，流程和網頁版相同（bridge.js 也會注入這個 iframe） -->
<main class="pane-post" id="panePost" role="tabpanel" aria-labelledby="tabPost">
  <iframe id="app" src="https://unnn3ing-oss.github.io/-schedulenewnet/" title="網新快速排程" allow="clipboard-read; clipboard-write"></iframe>
</main>

<div class="wrap" id="paneInfo" role="tabpanel" aria-labelledby="tabInfo" hidden>
  <header>
    <h1 id="extName">網新快速排程</h1>
    <span class="muted" id="extVer"></span>
  </header>

  <section class="card" id="loginCard">
    <h2>登入狀態</h2>
    <div class="status" id="loginStatus">檢查中…</div>
  </section>

  <section class="card">
    <h2>工具</h2>
    <div class="links">
      <a class="btn" href="https://unnn3ing-oss.github.io/-schedulenewnet/verify.html" target="_blank" rel="noopener">連線驗證</a>
      <a class="btn" href="https://unnn3ing-oss.github.io/-schedulenewnet/render-test.html" target="_blank" rel="noopener">自製圖測試</a>
    </div>
  </section>

  <section class="card" id="updateCard">
    <h2>版本更新</h2>
    <div class="up-status" id="upStatus">尚未檢查更新</div>
    <div class="up-notes" id="upNotes" hidden></div>
    <details class="up-files" id="upFiles" hidden>
      <summary id="upFilesSummary">要更新的檔案</summary>
      <ul id="upFileList"></ul>
    </details>
    <div class="row">
      <button type="button" class="btn" id="upCheckBtn">檢查更新</button>
      <button type="button" class="btn primary" id="upApplyBtn" hidden>更新到最新版</button>
    </div>
    <div class="hint" id="upHint"></div>
    <div class="up-folder" id="upFolder" hidden>更新位置：已記住<button type="button" class="up-link" id="upRepick">更換資料夾</button></div>
  </section>
</div>

<!-- 更新彈窗：有新版、選資料夾、確認權限變動、進度、完成／失敗都在這裡，不用瀏覽器的對話框 -->
<dialog class="up-dlg" id="upDlg" aria-labelledby="upDlgTitle">
  <h2 id="upDlgTitle"></h2>
  <div class="up-dlg-body" id="upDlgBody"></div>
  <div class="up-dlg-prog" id="upDlgProg" hidden><i id="upDlgBar"></i></div>
  <div class="up-dlg-btns" id="upDlgBtns"></div>
</dialog>
<script src="updater.js"></script>
<script src="sidepanel.js"></script>
</body>
</html>
